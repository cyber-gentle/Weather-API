<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App UI</title>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent-yellow: #facc15;
      --accent-blue: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background: #090d16;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Mobile Viewport Wrapper */
    .app-container {
      width: 100%;
      max-width: 390px;
      height: 844px;
      background: var(--bg-gradient);
      border-radius: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      border: 4px solid rgba(255, 255, 255, 0.05);
    }

    /* Screen Content - Scrollable area */
    .screen-content {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 100px 20px;
      scrollbar-width: none; /* Firefox */
    }

    .screen-content::-webkit-scrollbar {
      display: none; /* Chrome/Safari */
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .location-info h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .location-info p {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .search-btn {
      width: 40px;
      height: 40px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: var(--text-primary);
    }

    /* Hero Section */
    .hero-weather {
      text-align: center;
      margin-bottom: 32px;
      position: relative;
    }

    .weather-graphic {
      width: 120px;
      height: 120px;
      margin: 0 auto 12px auto;
      display: block;
      filter: drop-shadow(0 8px 16px rgba(56, 189, 248, 0.2));
    }

    .current-temp {
      font-size: 64px;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
      margin-bottom: 4px;
    }

    .condition-label {
      font-size: 18px;
      font-weight: 500;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .hi-lo-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    /* Horizontal Hourly Strip */
    .section-title {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .hourly-container {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 28px;
      scrollbar-width: none;
    }

    .hourly-container::-webkit-scrollbar {
      display: none;
    }

    .hourly-card {
      min-width: 65px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 12px 8px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .hourly-card.active {
      background: linear-gradient(135deg, var(--accent-blue) 0%, #0284c7 100%);
      border: none;
    }

    .hourly-card span {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .hourly-card.active span {
      color: rgba(255, 255, 255, 0.8);
    }

    .hourly-card .temp {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
    }

    .hourly-card img {
      width: 28px;
      height: 28px;
    }

    /* Metrics Grid */
    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1xl);
      gap: 14px;
      margin-bottom: 28px;
    }

    .metric-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .metric-label {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .metric-value {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 2px;
    }

    /* Weekly Forecast */
    .weekly-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 16px;
    }

    .weekly-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .weekly-row:last-child {
      border-bottom: none;
      padding-bottom: 4px;
    }

    .weekly-row:first-child {
      padding-top: 4px;
    }

    .day-name {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      width: 50px;
    }

    .weekly-icon {
      width: 28px;
      height: 28px;
    }

    .weekly-range {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .weekly-range span {
      font-size: 14px;
      font-weight: 500;
    }

    .weekly-range .low {
      color: var(--text-secondary);
      width: 28px;
      text-align: right;
    }

    .weekly-range .high {
      color: var(--text-primary);
      width: 28px;
      text-align: right;
    }

    .progress-bar {
      width: 60px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .progress-fill {
      position: absolute;
      left: 20%;
      right: 15%;
      height: 100%;
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-yellow));
      border-radius: 2px;
    }

    /* Bottom Navigation Bar */
    .nav-bar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: 20px;
      height: 64px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 32px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 0 10px;
      z-index: 10;
    }

    .nav-item {
      width: 44px;
      height: 44px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-secondary);
      cursor: pointer;
      border-radius: 50%;
      transition: all 0.2s ease;
    }

    .nav-item.active {
      color: var(--accent-blue);
      background: rgba(56, 189, 248, 0.1);
    }

    /* Inline SVG utility sizing */
    .icon {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
